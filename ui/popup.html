<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Popup</title>
<style>
:root{--page:#F4F3ED;--chrome:#E8EBDF;--ink:#243328;--sage:#516D4F;--muted:#606B5E;--line:rgba(36,51,40,.2);--sel:rgba(81,109,79,.14)}
@media (prefers-color-scheme:dark){:root{--page:#202722;--chrome:#141915;--ink:#EFF7E1;--sage:#8CAF87;--muted:#96A294;--line:rgba(239,247,225,.2);--sel:rgba(140,175,135,.18)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;overflow:hidden;font-family:-apple-system,"system-ui","Segoe UI",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
.card{height:100%;background:var(--page);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.find{display:none;height:100%;align-items:center;gap:6px;padding:0 10px 0 14px}
.find input{all:unset;flex:1;min-width:0;font-size:14px;-webkit-user-select:text;user-select:text}
.find input::placeholder{color:var(--muted)}
.cnt{font-size:12px;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right}
.b{all:unset;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.b:hover{background:var(--chrome);color:var(--ink)}
.b svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.list{display:none;padding:6px}
.it{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:10px;cursor:default}
.it.sel,.it:hover{background:var(--sel)}
.ic{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.u{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
</style>
</head>
<body>
<div class="card">
  <div class="find" id="find">
    <input id="q" placeholder="Zoek op pagina" spellcheck="false" autocomplete="off">
    <span class="cnt" id="cnt"></span>
    <button class="b" id="prev" title="Vorige"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="b" id="next" title="Volgende"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="b" id="close" title="Sluiten"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const ICONS = {
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  url: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13.500 0 16M12 4c-2.5 2.5-2.5 13.500 0 16"/>',
  history: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  bookmark: '<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8-4.3-4.1 5.9-.8z"/>'
};
let items = [], sel = -1, qTimer = null;

function render(s) {
  const f = s.mode === 'find';
  $('find').style.display = f ? 'flex' : 'none';
  $('list').style.display = f ? 'none' : 'block';
  if (f) {
    if (s.text !== undefined && document.activeElement !== $('q') && !$('q').value) $('q').value = s.text || '';
    const x = s.found || { active: 0, matches: 0 };
    $('cnt').textContent = $('q').value ? (x.matches ? x.active + ' van ' + x.matches : 'Geen resultaten') : '';
  } else {
    items = s.items || []; sel = s.sel === undefined ? -1 : s.sel;
    const l = $('list'); l.textContent = '';
    items.forEach((it, i) => {
      const d = document.createElement('div'); d.className = 'it' + (i === sel ? ' sel' : '');
      d.innerHTML = '<svg class="ic" viewBox="0 0 24 24">' + (ICONS[it.type] || ICONS.url) + '</svg>';
      const t = document.createElement('div'); t.className = 't';
      t.textContent = it.type === 'search' ? 'Zoek naar "' + it.title + '"' : it.title;
      d.appendChild(t);
      if (it.type !== 'search') { const u = document.createElement('div'); u.className = 'u'; u.textContent = it.url.replace(/^https?:\/\//, ''); d.appendChild(u); }
      d.onmousedown = e => { e.preventDefault(); api.pick(i); };
      l.appendChild(d);
    });
  }
}
api.onState(render);
api.onFocus(() => { $('q').focus(); $('q').select(); });
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => api.findQuery($('q').value), 60); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') api.findStep(!e.shiftKey);
  if (e.key === 'Escape') api.findClose();
});
$('next').onclick = () => api.findStep(true);
$('prev').onclick = () => api.findStep(false);
$('close').onclick = () => api.findClose();
api.ready();
</script>
</body>
</html>
