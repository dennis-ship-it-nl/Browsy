<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Downloads</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Browsy</div>
  <h1>Je <em>downloads</em></h1>
  <div id="list"></div>
  <p style="margin-top:28px"><button class="btn" id="clear">Wis de lijst</button></p>
  <p class="note">Bestanden worden opgeslagen in je map Downloads.</p>
</div>
<script>
const list = document.getElementById('list');
const mb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
async function load() {
  const items = await daarom.invoke('downloads:list');
  list.textContent = '';
  if (!items.length) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'Nog geen downloads.'; list.appendChild(p); return; }
  items.forEach(d => {
    const row = document.createElement('div'); row.className = 'row';
    const main = document.createElement('div'); main.className = 'main';
    const t = document.createElement('div'); t.className = 't'; t.textContent = d.name;
    const u = document.createElement('div'); u.className = 'u';
    const status = { progressing: 'Bezig', paused: 'Gepauzeerd', completed: 'Klaar', cancelled: 'Geannuleerd', interrupted: 'Onderbroken' }[d.state] || d.state;
    u.textContent = status + (d.total ? ' · ' + mb(d.state === 'completed' ? d.total : d.received) + (d.state === 'progressing' ? ' van ' + mb(d.total) : '') : '');
    main.append(t, u);
    if (d.state === 'progressing' && d.total) { const b = document.createElement('div'); b.className = 'bar'; const i = document.createElement('i'); i.style.width = Math.round(d.received / d.total * 100) + '%'; b.appendChild(i); main.appendChild(b); }
    row.appendChild(main);
    const btn = (label, fn) => { const x = document.createElement('button'); x.className = 'btn'; x.textContent = label; x.onclick = fn; row.appendChild(x); };
    if (d.state === 'completed') { btn('Open', () => daarom.invoke('downloads:open', d.key)); btn('Toon in map', () => daarom.invoke('downloads:show', d.key)); }
    if (d.state === 'progressing') btn('Annuleer', () => daarom.invoke('downloads:cancel', d.key));
    list.appendChild(row);
  });
}
document.getElementById('clear').onclick = async () => { await daarom.invoke('downloads:clear'); load(); };
load(); setInterval(load, 1000);
</script>
</body>
</html>
